name: Anchored Feedback QA

on:
  push:
    branches: [agent/anchored-consumer-feedback]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cases.js
          node --check compact-cases.js
          node --check mobile-plan-case.js
          node --check court-case.js
          node --check membership-config.js
          node --check feedback.js

      - name: Exercise selection feedback in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          cp index.html index-real.html

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          real='<script defer src="https://liuh886.github.io/admin/shared/account-shell.js?v=6"></script>'
          stub='''<script>
          (()=>{
            const mode=new URLSearchParams(location.search).get('qa')||'';
            const signed=mode!=='loggedout';
            const user=signed?{id:'00000000-0000-4000-8000-000000000001'}:null;
            const snapshot=()=>({user,profile:signed?{display_name:'QA Consumer'}:null,loading:false,productCode:'buchikui'});
            window.HaoAccount={
              getState:snapshot,
              open(){document.body.dataset.qaAccountOpened='true'},
              close(){},
              async getClient(){return{from(){return{async insert(payload){
                document.body.dataset.qaInserted='true';
                document.body.dataset.qaInsertProduct=payload.product_code||'';
                document.body.dataset.qaInsertKind=payload.metadata?.kind||'';
                document.body.dataset.qaInsertType=payload.metadata?.feedback_type||'';
                document.body.dataset.qaInsertAnchor=payload.metadata?.anchor_key||'';
                document.body.dataset.qaInsertUrl=payload.page_url||'';
                return {error:null};
              }}}}},
              subscribe(listener){listener(snapshot());return()=>{};}
            };
          })();
          </script>'''
          s=s.replace(real,stub)
          s=s.replace('<script defer src="feedback.js"></script>','<script src="feedback.js"></script>')
          probe='''<script>
          (()=>{
            const mode=new URLSearchParams(location.search).get('qa');
            if(!mode)return;
            const body=document.body;
            const markOverflow=()=>body.dataset.qaOverflow=String(document.documentElement.scrollWidth>document.documentElement.clientWidth);
            setTimeout(()=>{
              markOverflow();
              const paragraph=document.querySelector('#caseList .case-block p');
              const walker=document.createTreeWalker(paragraph,NodeFilter.SHOW_TEXT);
              let node=null;
              while(walker.nextNode()){
                if((walker.currentNode.nodeValue||'').trim().length>=8){node=walker.currentNode;break;}
              }
              if(!node){body.dataset.qaSelection='missing';return;}
              const raw=node.nodeValue||'';
              const start=Math.max(0,raw.search(/\\S/));
              const end=Math.min(raw.length,start+Math.max(8,Math.min(22,raw.trim().length)));
              const range=document.createRange();
              range.setStart(node,start);range.setEnd(node,end);
              const selection=getSelection();selection.removeAllRanges();selection.addRange(range);
              document.dispatchEvent(new Event('selectionchange'));
              setTimeout(()=>{
                const action=document.getElementById('consumerFeedbackAction');
                body.dataset.qaSelection=String(Boolean(action&&!action.hidden));
                action?.click();
                setTimeout(()=>{
                  body.dataset.qaPending=String(Boolean(sessionStorage.getItem('buchikui-pending-feedback-v1')));
                  body.dataset.qaComposer=String(Boolean(document.getElementById('consumerFeedbackComposer')&&!document.getElementById('consumerFeedbackComposer').hidden));
                  body.dataset.qaQuote=String(document.getElementById('consumerFeedbackQuote')?.textContent?.length||0);
                  markOverflow();
                  if(mode==='submit'){
                    const textarea=document.getElementById('consumerFeedbackMessage');
                    textarea.value='我实际遇到过类似情况，提交工单后平台补充提供了书面处理依据。';
                    document.querySelector('#consumerFeedbackForm input[value="experience"]').checked=true;
                    document.getElementById('consumerFeedbackForm').requestSubmit();
                    setTimeout(markOverflow,500);
                  }
                },180);
              },180);
            },180);
          })();
          </script>'''
          p.write_text(s.replace('</body>',probe+'</body>'))
          PY

          python3 -m http.server 4173 >/tmp/buchikui-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1

          BASE='http://127.0.0.1:4173/?case=rental'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=1440,1100 --screenshot=/tmp/feedback-desktop.png "$BASE&qa=composer"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=390,844 --screenshot=/tmp/feedback-mobile.png "$BASE&qa=composer"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=1440,1100 --dump-dom "$BASE&qa=composer" >/tmp/composer.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=390,844 --dump-dom "$BASE&qa=composer" >/tmp/composer-mobile.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=390,844 --dump-dom "$BASE&qa=loggedout" >/tmp/loggedout.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2600 --window-size=1440,1100 --dump-dom "$BASE&qa=submit" >/tmp/submit.html

          for f in /tmp/composer.html /tmp/composer-mobile.html; do
            grep -q 'data-qa-overflow="false"' "$f"
            grep -q 'data-qa-selection="true"' "$f"
            grep -q 'data-qa-composer="true"' "$f"
            grep -Eq 'data-qa-quote="[1-9][0-9]*"' "$f"
          done
          grep -q 'data-qa-account-opened="true"' /tmp/loggedout.html
          grep -q 'data-qa-pending="true"' /tmp/loggedout.html
          grep -q 'data-qa-inserted="true"' /tmp/submit.html
          grep -q 'data-qa-insert-product="buchikui"' /tmp/submit.html
          grep -q 'data-qa-insert-kind="anchored_consumer_experience"' /tmp/submit.html
          grep -q 'data-qa-insert-type="experience"' /tmp/submit.html
          grep -q 'case=rental' /tmp/submit.html

          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=1440,900 --dump-dom 'http://127.0.0.1:4173/index-real.html?case=beauty-hair' >/tmp/real-account.html
          grep -q 'hao-account-trigger' /tmp/real-account.html

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: anchored-feedback-qa
          path: |
            /tmp/feedback-desktop.png
            /tmp/feedback-mobile.png
            /tmp/composer.html
            /tmp/composer-mobile.html
            /tmp/loggedout.html
            /tmp/submit.html
            /tmp/real-account.html

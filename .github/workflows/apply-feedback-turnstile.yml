name: Turnstile feedback QA

on:
  push:
    branches:
      - agent/protect-feedback-with-turnstile
    paths:
      - .github/workflows/apply-feedback-turnstile.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/protect-feedback-with-turnstile
      - name: Static contract
        run: |
          node --check feedback.js
          grep -F 'challenges.cloudflare.com/turnstile/v0/api.js?render=explicit' index.html
          grep -F "client.functions.invoke('feedback-submit'" feedback.js
          grep -F '验证后提交' feedback.js
          grep -F 'consumer-feedback-turnstile' feedback.css
          ! grep -F ".from('product_feedback').insert" feedback.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function type check
        run: deno check supabase/functions/feedback-submit/index.ts
      - name: Browser smoke
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/buchikui-http.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({ headless: true });
            for (const [width,height] of [[1440,1100],[390,844]]) {
              const page = await browser.newPage({ viewport: { width, height } });
              await page.route('https://liuh886.github.io/admin/shared/account-shell.js*', async route => {
                await route.fulfill({
                  contentType: 'application/javascript',
                  body: `window.HaoAccount={
                    getState(){return {user:{id:'00000000-0000-4000-8000-000000000001'}}},
                    async getClient(){return {functions:{invoke:async(_name,{body})=>{
                      if(body.action==='config'){
                        await new Promise(r=>setTimeout(r,350));
                        return {data:{enabled:true,site_key:'1x00000000000000000000AA',action:'buchikui_feedback'},error:null};
                      }
                      if(body.action==='submit') return {data:{ok:true},error:null};
                      return {data:null,error:new Error('unexpected action')};
                    }}}},
                    subscribe(){}
                  };`
                });
              });
              await page.goto('http://127.0.0.1:4173/?case=rental', { waitUntil: 'networkidle' });
              await page.evaluate(()=>{
                const target=document.getElementById('heroCopy');
                const range=document.createRange();
                range.selectNodeContents(target);
                const selection=window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                document.dispatchEvent(new Event('selectionchange'));
              });
              await page.waitForSelector('#consumerFeedbackAction:not([hidden])');
              await page.click('#consumerFeedbackAction');
              await page.waitForSelector('#consumerFeedbackComposer:not([hidden])');
              const submit=page.locator('#consumerFeedbackSubmit');
              if(!await submit.isDisabled()) throw new Error(`submit unlocked before Turnstile at ${width}`);
              await page.waitForFunction(()=>!document.getElementById('consumerFeedbackSubmit').disabled, null, { timeout: 10000 });
              const verification=await page.locator('#consumerFeedbackVerificationStatus').innerText();
              if(!verification.includes('验证完成')) throw new Error(`missing verified state at ${width}: ${verification}`);
              await page.fill('#consumerFeedbackMessage','这是自动化测试经验，不会进入真实数据库。');
              await submit.click();
              await page.waitForFunction(()=>document.getElementById('consumerFeedbackComposer').hidden === true);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error(`horizontal overflow at ${width}`);
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

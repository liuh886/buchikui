name: Apply rental downtime defense

on:
  push:
    branches:
      - agent/add-rental-downtime-defense

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/add-rental-downtime-defense
      - name: Apply focused rental CASE edits
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('cases.js')
          s=p.read_text()
          def rep(old,new):
              global s
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:90]}')
              s=s.replace(old,new,1)

          rep("title:'不吃亏｜租车维权：正常服务标准 + 8 个常见问题'", "title:'不吃亏｜租车维权：正常服务标准 + 9 个常见问题'")
          rep("description:'先看一次正常租车应完成的主体、收费、交车、车况、保障、救援、还车与结算标准，再处理无车、换车、提灯验损、信用免押划扣、拒赔等常见问题。'", "description:'先看一次正常租车应完成的主体、车辆性质、收费、交车、车况、保障、救援、还车与结算标准，再处理无车、换车、提灯验损、停运损失费、信用免押划扣、拒赔等常见问题。'")
          rep("shareText:'租车维权先看服务标准：谁在履约、费用、交车、旧伤、保障、救援、还车、结算都应该说清并留痕；没做到，再进入对应维权场景。'", "shareText:'租车维权先看服务标准：谁在履约、车辆是否登记为租赁、费用、交车、旧伤、保障、救援、还车和结算都应该说清并留痕；被收停运损失费时，先查车辆性质、合同和实际损失依据。'")
          rep("{title:'交付哪辆车<br>现场对上',text:'实际交付车辆应与订单 / 合同可核对，随车有行驶证，车辆满足上路条件、设施设备功能正常。换车时也要同步更新车辆和保障信息。'}", "{title:'交付哪辆车<br>现场对上',text:'实际交付车辆应与订单 / 合同可核对，随车有行驶证。按《小微型客车租赁经营服务管理办法》，投入租赁经营的小微型客车登记使用性质应为“租赁”；取车时就拍下行驶证并核对使用性质。车辆还应满足上路条件、设施设备功能正常；换车时也要同步更新车辆和保障信息。'}")
          rep("intro:'先对照上面的正常服务基线，再按租车过程找到最接近的一项：下单主体、取车、换车、保障、取还车验损、扣款、理赔或违章收费。每一项只看两件事：关键事实和现在做什么。'", "intro:'先对照上面的正常服务基线，再按租车过程找到最接近的一项：下单主体、取车、换车、保障、取还车验损、停运损失费、扣款、理赔或违章收费。每一项只看两件事：关键事实和现在做什么。'")
          rep("{label:'关键事实',html:'<p><strong class=\"key\">在聚合、加盟、品牌授权模式里，门头品牌和实际经营主体不一致是需要默认核验的结构性风险</strong>。平台品牌不等于订单里的实际出租方，门头写“官方授权”也不等于直营网点。悟空租车官方公开招募品牌加盟商并提供品牌授权；租车行业公开调查也指出部分线上平台存在挂靠经营、消费者难辨实际经营者的问题。真正影响后续投诉和诉讼的，是<strong class=\"key\">经营主体 + 合同出租方 + 实际收款方 + 实际交车方</strong>到底是谁。</p>'}", "{label:'关键事实',html:'<p><strong class=\"key\">在聚合、加盟、品牌授权模式里，门头品牌和实际经营主体不一致是需要默认核验的结构性风险</strong>。平台品牌不等于订单里的实际出租方，门头写“官方授权”也不等于直营网点。真正影响后续投诉和诉讼的，是<strong class=\"key\">经营主体 + 合同出租方 + 实际收款方 + 实际交车方</strong>到底是谁。</p>'}")

          marker="""      {
        short:'信用免押被扣',risk:'该赔多少 ≠ 平台能不能直接扣',title:'平台直接划扣了钱，先把“赔不赔”和“能不能扣”拆开',"""
          scenario="""      {
        short:'停运损失费',risk:'先查车辆性质，再查真实损失',title:'修车几天就按天收“停运损失费”？先别直接认',
        blocks:[
          {label:'关键事实',html:'<p>先分清<strong class="key">车辆是否具备合规租赁登记</strong>，再谈有没有“停运损失”。《小微型客车租赁经营服务管理办法》第六条要求，投入租赁经营的小微型客车登记使用性质应为<strong class="key">“租赁”</strong>；如果行驶证写“非营运”，至少说明车辆登记性质与该办法对租赁经营车辆的要求不一致。公开裁判中，珠海香洲法院对非营运车辆用于出租的案件未支持租车公司的停运费；兴庆区法院 2026 年公开案例也未支持非营运车辆出租后的停运损失主张。<strong class="key">但“合同没写停运费”也不等于任何实际损失都绝对不能主张</strong>：民法典允许符合条件的实际可得利益损失，租车公司不能仅凭内部日租价或自定标准直接把一笔固定“停运费”算到你头上，仍要证明请求基础、实际损失、合理期间和计算依据。</p>'},
          {label:'现在做什么',kind:'action',html:'<p>收到“停运损失费”时先<strong class="key">拒绝直接付款、签字或确认金额</strong>，一次要求对方提供：① 行驶证使用性质；② 经营者和车辆的小微型客车租赁备案信息；③ 合同中相关损失 / 费用条款及计算方式；④ 实际维修或合理停驶天数；⑤ 同期间真实出租收入、订单、可替代车辆情况及扣除必要成本后的实际损失。取车时就拍行驶证；还可在交通运输部“查询服务”里的<strong class="key">小微客车租赁经营备案查询</strong>核对企业和备案信息。普通自驾租赁优先查租赁备案，不要把《道路运输经营许可证》当成所有租车公司的统一必备证照；若商家另从事需许可的道路运输业务，再另查道路运政经营业户 / 营运车辆。</p>'}
        ]
      },
"""
          if s.count(marker)!=1:
              raise SystemExit('credit scenario marker not unique')
          s=s.replace(marker,scenario+marker,1)

          rep("{key:'entity',group:'core',title:'平台 + 实际经营主体',detail:'平台入口、商家页、营业执照、合同出租方和实际交车方',when:'下单 / 到店'}", "{key:'entity',group:'core',title:'平台 + 实际经营主体',detail:'平台入口、商家页、营业执照、合同出租方、实际交车方和租赁经营备案',when:'下单 / 到店'}")
          rep("{key:'vehicle',group:'vehicle',title:'车牌 + 行驶证',detail:'确认实际车辆、登记信息和使用性质',when:'取车'}", "{key:'vehicle',group:'vehicle',title:'车牌 + 行驶证 + 备案',detail:'确认实际车辆；行驶证使用性质是否为“租赁”；保存小微客车租赁经营备案查询结果',when:'取车'}")
          rep("{key:'damage',group:'dispute',title:'定损 / 维修 / 违法记录',detail:'损伤、维修项目、金额凭证与官方违法信息',when:'被索赔'}", "{key:'damage',group:'dispute',title:'定损 / 维修 / 停运 / 违法记录',detail:'损伤、维修项目、实际维修期间、停运损失计算材料、金额凭证与官方违法信息',when:'被索赔'}")
          rep("{title:'租赁经营 / 履约<br>12328',text:'涉及租赁经营主体、无法按订单提供车辆、服务规范等问题，可向所在地小微型客车租赁行政主管部门或 12328 反映。'", "{title:'租赁经营 / 履约<br>12328',text:'涉及租赁经营主体、车辆使用性质 / 租赁备案、无法按订单提供车辆、服务规范等问题，可向所在地小微型客车租赁行政主管部门或 12328 反映。'")
          rep("争议类型：【主体不清 / 无车 / 换车 / 重复保障 / 验损 / 信用免押扣款 / 拒赔 / 违章附加费】", "争议类型：【主体不清 / 无车 / 换车 / 重复保障 / 验损 / 停运损失费 / 信用免押扣款 / 拒赔 / 违章附加费】")
          rep("④ 定损 / 维修 / 收费金额的计算依据；\\n⑤ 如涉及保险、保障或直接划扣，请说明责任范围、具体授权、审查材料、通知和申诉渠道。", "④ 定损 / 维修 / 收费金额的计算依据；\\n⑤ 如主张停运损失，请提供车辆使用性质、租赁备案、合理停运期间、实际经营收入及扣除必要成本后的损失计算；\\n⑥ 如涉及保险、保障或直接划扣，请说明责任范围、具体授权、审查材料、通知和申诉渠道。")

          old="""      {title:'交通运输部：《小微型客车租赁经营服务管理办法》（2021 年修正版）',href:'https://xxgk.mot.gov.cn/jigou/fgs/202108/t20210825_3616598.html',note:'第 11—12 条要求提供安全便利优质服务，并明示服务项目、租赁流程、车辆类型、收费、押金收退、客服监督电话；同时规定车辆交付状态、行驶证、检测维护和救援换车。'},"""
          new="""      {title:'交通运输部：《小微型客车租赁经营服务管理办法》（2021 年修正版）',href:'https://xxgk.mot.gov.cn/jigou/fgs/202108/t20210825_3616598.html',note:'第 6 条明确投入租赁经营的小微型客车登记使用性质应为“租赁”；第 7—8 条规定经营者及车辆备案建档；第 11—12 条规定服务明示、车辆交付、行驶证、维护和救援换车；第 20 条要求备案信息向社会公布并传送至全国互联网道路运输便民政务服务系统。'},
      {title:'交通运输部办公厅：贯彻实施《小微型客车租赁经营服务管理办法》的通知',href:'https://xxgk.mot.gov.cn/jigou/ysfws/202107/t20210705_3611179.html',note:'要求各地将小微型客车租赁经营者和车辆备案建档信息汇总至部级运政系统，并依托全国互联网道路运输便民政务服务系统提供“一站式”查询；交通运输部查询服务目前单列“小微客车租赁经营备案查询”。'},
      {title:'珠海市香洲区人民法院：非营运车辆用于出租，停运费未获支持',href:'https://www.zhxzcourt.gov.cn/article/detail/2023/04/id/8816720.shtml',note:'公开案例中，法院认为将非营运车辆用于出租违反汽车租赁行业管理规范，但不当然导致租赁合同无效；因案涉车辆并非营运车辆，不应产生营运收益，对租车公司停运费请求不予支持。'},
      {title:'兴庆区人民法院：私家车外租牟利，非营运车辆停运损失未获支持',href:'https://xqq.nxfy.gov.cn/xqxwzx/xqfyzx/202605/t20260514_5089490.html',note:'2026 年公开案例：非营运车辆交由租车公司出租牟利，法院对车主主张的停运损失不予支持，并提示租车公司应审查挂靠车辆的使用性质。'},
      {title:'最高人民法院：《中华人民共和国民法典》及合同损失规则',href:'https://www.court.gov.cn/zixun/xiangqing/233181.html',note:'民法典第 584 条允许守约方主张可证明、可预见的违约损失和可得利益；第 585 条允许约定违约金或损失计算方法。合同未写固定“停运费”不等于任何实际损失都当然消失，但经营者仍需证明损失基础和金额。'},"""
          rep(old,new)
          rep("公开案例也不意味着所有信用免押扣款当然无效。'", "公开案例也不意味着所有信用免押扣款当然无效；“停运损失费”是否成立，应结合车辆使用性质和备案、合同 / 法律上的请求基础、实际损失、合理期间和计算依据判断，不能把个案结论泛化为所有租车纠纷当然不赔。'")

          p.write_text(s)
          PY
          node --check cases.js
          node <<'NODE'
          global.window={BUCHIKUI_CASES:[]};
          require('./cases.js');
          const c=window.BUCHIKUI_CASES.find(x=>x.id==='001');
          if(!c) throw new Error('rental case missing');
          if(c.scenarios.length!==9) throw new Error(`expected 9 rental scenarios, got ${c.scenarios.length}`);
          const stop=c.scenarios.find(x=>x.short==='停运损失费');
          if(!stop) throw new Error('downtime scenario missing');
          const text=JSON.stringify(c);
          for(const phrase of ['登记使用性质应为“租赁”','小微客车租赁经营备案查询','拒绝直接付款','非营运车辆用于出租','合理停运期间']) if(!text.includes(phrase)) throw new Error(`missing ${phrase}`);
          if(text.includes('悟空租车官方公开招募品牌加盟商并提供品牌授权；租车行业公开调查')) throw new Error('background evidence still in body');
          console.log({scenarios:c.scenarios.length,sources:c.sources.length});
          NODE
      - name: Commit focused edit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cases.js
          git commit -m "add rental downtime loss defense"
          git push origin HEAD:agent/add-rental-downtime-defense

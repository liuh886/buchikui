name: CASE 006 formula QA

on:
  push:
    branches:
      - agent/fix-case006-annualized-multiples

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Formula and syntax
        run: |
          node --check investment-advisor-case.js
          node --check case-visual.js
          node <<'NODE'
          global.window={BUCHIKUI_CASES:[]};
          require('./investment-advisor-case.js');
          const m=window.BUCHIKUI_CASES.find(x=>x.id==='006').costModel;
          const iqq=m.benchmarks.find(x=>x.name==='IQQ');
          const loss=(r,n)=>1-Math.pow(1-r,n);
          const got=[1,5,10].map(n=>Number((loss(m.annualizedComparisonFee,n)/loss(iqq.fee,n)).toFixed(2)));
          const want=[19.10,18.42,17.62];
          if(JSON.stringify(got)!==JSON.stringify(want)) throw new Error(`wrong multiples ${got}`);
          console.log({got, advisor5:loss(m.annualizedComparisonFee,5), iqq5:loss(iqq.fee,5), advisor10:loss(m.annualizedComparisonFee,10), iqq10:loss(iqq.fee,10)});
          NODE
      - name: Browser smoke
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/buchikui-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [width,height] of [[1440,1200],[390,844]]){
              const page=await browser.newPage({viewport:{width,height}});
              await page.goto('http://127.0.0.1:4173/?case=alipay-advisor-cost',{waitUntil:'networkidle'});
              const text=await page.locator('#caseVisual').innerText();
              for(const value of ['19.10×','18.42×','17.62×']) if(!text.includes(value)) throw new Error(`missing ${value}`);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error(`overflow at ${width}`);
            }
            await browser.close();
          })();
          NODE

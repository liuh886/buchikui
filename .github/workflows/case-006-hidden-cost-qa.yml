name: CASE 006 hidden cost QA

on:
  push:
    branches:
      - agent/model-case006-hidden-rebalance-cost

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Formula and syntax
        run: |
          node --check investment-advisor-case.js
          node --check case-visual.js
          node <<'NODE'
          global.window={BUCHIKUI_CASES:[]};
          require('./investment-advisor-case.js');
          const m=window.BUCHIKUI_CASES.find(x=>x.id==='006').costModel;
          if('annualizedComparisonFee' in m) throw new Error('obsolete annualizedComparisonFee remains');
          const iqq=m.benchmarks.find(x=>x.name==='IQQ');
          const advisor=(n,drag=0)=>m.principal*(1-m.purchaseFee)*Math.pow((1+m.grossReturn)*(1-m.recurringFee)*(1-drag),n)*(1-m.redemptionFee);
          const ref=n=>m.principal*Math.pow((1+m.grossReturn)*(1-iqq.fee),n);
          const horizons=[5,10,20].map(n=>[Math.round(advisor(n)),Math.round(ref(n)),Math.round(ref(n)-advisor(n))]);
          const want=[[13456,14620,1164],[18147,21374,3227],[33006,45686,12680]];
          if(JSON.stringify(horizons)!==JSON.stringify(want)) throw new Error(`horizons ${JSON.stringify(horizons)}`);
          const sens=[0,.002,.005,.01].map(d=>Math.round(ref(10)-advisor(10,d)));
          const wantSens=[3227,3587,4114,4962];
          if(JSON.stringify(sens)!==JSON.stringify(wantSens)) throw new Error(`sensitivity ${sens}`);
          console.log({horizons,sens});
          NODE
      - name: Browser smoke
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/buchikui-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [width,height] of [[1440,1200],[390,844]]){
              const page=await browser.newPage({viewport:{width,height}});
              await page.goto('http://127.0.0.1:4173/?case=alipay-advisor-cost',{waitUntil:'networkidle'});
              const text=await page.locator('#caseVisual').innerText();
              for(const value of ['¥1,164','¥3,227','¥12,680','¥3,587','¥4,114','¥4,962','调仓摩擦：未知']) if(!text.includes(value)) throw new Error(`missing ${value}`);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error(`overflow at ${width}`);
            }
            await browser.close();
          })();
          NODE

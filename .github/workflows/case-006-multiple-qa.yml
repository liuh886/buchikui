name: CASE 006 fee multiple QA

on:
  push:
    branches:
      - agent/emphasize-advisor-fee-multiples

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Formula checks
        run: |
          node --check case-visual.js
          node <<'NODE'
          global.window={BUCHIKUI_CASES:[]};
          require('./investment-advisor-case.js');
          const m=window.BUCHIKUI_CASES.find(x=>x.id==='006').costModel;
          const iqq=m.benchmarks.find(x=>x.name==='IQQ');
          const advisor=y=>m.principal*(1-m.purchaseFee)*Math.pow(1-m.recurringFee,y)*(1-m.redemptionFee);
          const ref=y=>m.principal*Math.pow(1-iqq.fee,y);
          const ratio=y=>(m.principal-advisor(y))/(m.principal-ref(y));
          const got=[1,5,10].map(y=>Number(ratio(y).toFixed(1)));
          const want=[19.2,16.9,16.0];
          if(JSON.stringify(got)!==JSON.stringify(want)) throw new Error(`multiples ${got}`);
          if(Number((m.recurringFee/iqq.fee).toFixed(1))!==17) throw new Error('recurring multiple');
          console.log({got});
          NODE
      - name: Browser smoke
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 >/tmp/buchikui-http.log 2>&1 &
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [width,height] of [[1440,1200],[390,844]]){
              const page=await browser.newPage({viewport:{width,height}});
              await page.goto('http://127.0.0.1:4173/?case=alipay-advisor-cost',{waitUntil:'networkidle'});
              const text=await page.locator('#caseVisual').innerText();
              for(const value of ['19.2×','16.9×','16.0×','17.0×']) if(!text.includes(value)) throw new Error(`missing ${value}`);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error(`overflow at ${width}`);
            }
            await browser.close();
          })();
          NODE

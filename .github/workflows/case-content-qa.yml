name: CASE content QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check cases.js
          node --check compact-cases.js
          node --check mobile-plan-case.js
          node --check court-case.js
          node --check app.js
          node --check feedback.js
      - name: Validate CASE content contract
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          global.window = { BUCHIKUI_CASES: [] };
          require('./cases.js');
          require('./compact-cases.js');
          require('./mobile-plan-case.js');
          require('./court-case.js');

          const cases = window.BUCHIKUI_CASES;
          assert.equal(cases.length, 5);
          assert.equal(new Set(cases.map(item => item.slug)).size, cases.length);

          for (const slug of ['rental', 'beauty-hair', 'mobile-plan-cost', 'internet-court-self-litigation']) {
            const item = cases.find(candidate => candidate.slug === slug);
            assert(item, `missing ${slug}`);
            for (const scenario of item.scenarios ?? []) {
              assert.equal(scenario.blocks.length, 2, `${slug}/${scenario.short} should have two blocks`);
              assert.equal(scenario.blocks[0].label, '关键事实', `${slug}/${scenario.short} first block`);
              assert.equal(scenario.blocks[1].label, '现在做什么', `${slug}/${scenario.short} second block`);
            }
          }

          const rental = cases.find(item => item.slug === 'rental');
          const rentalText = JSON.stringify(rental);
          assert.match(rentalText, /用户主动取消/);
          assert.match(rentalText, /车况无异常 \/ 无异议/);
          assert.match(rentalText, /原订单车辆已正常交付/);

          const beauty = cases.find(item => item.slug === 'beauty-hair');
          const beautyText = JSON.stringify(beauty);
          assert.match(beautyText, /转卡或补差协议/);
          assert.match(beautyText, /不同意新增项目 \/ 费用/);
          assert.match(beautyText, /明确同意具体项目和价格/);

          const mobile = cases.find(item => item.slug === 'mobile-plan-cost');
          assert.doesNotMatch(JSON.stringify(mobile), /价格歧视/);

          const court = cases.find(item => item.slug === 'internet-court-self-litigation');
          assert.equal(court.name, '第一次自己打民事官司');
          assert.doesNotMatch(JSON.stringify(court), /7 日内预交|诉讼费缴纳通知/);
          NODE

name: Consolidate editorial copy

on:
  push:
    branches:
      - editorial/consolidate-copy-and-standard-20260902

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consolidate final runtime copy into case sources
        run: node tools/consolidate-editorial.js
      - name: Commit consolidated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Consolidate editorial copy into case sources"
          git push origin HEAD:editorial/consolidate-copy-and-standard-20260902

name: Corpus Link Check

# Phase C：语料层链接体检。
# 项目的唯一承诺是「可核验」，而链接腐烂是头号死因，所以每天跑一次。
# 全量检查有 HTTP 错误时更新同一条 issue；零错误且零网络未知时才关闭。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '只检查 id 包含该子串的记录（留空则全查）'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: buchikui-link-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate corpus
        run: node scripts/check-corpus.mjs

      - name: Check source links
        id: links
        env:
          ONLY: ${{ inputs.only || '' }}
        run: |
          node scripts/check-links.mjs --only="$ONLY" --issue-file="$RUNNER_TEMP/links.md" --report-file="$RUNNER_TEMP/links.json"

      - name: Synchronize link-check issue
        if: ${{ steps.links.outputs.full_scan == 'true' && steps.links.outputs.checked_count != '0' && (steps.links.outputs.broken_count != '0' || steps.links.outputs.offline_count == '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-link-check-issue.mjs "$RUNNER_TEMP/links.json" "$RUNNER_TEMP/links.md"

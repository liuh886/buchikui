name: Editorial UI QA

on:
  push:
    branches: [agent/refine-standard-case-editorial-ui]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Render rental and beauty baselines in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          probe='''<script>
          (()=>{
            const params=new URLSearchParams(location.search);
            const qa=params.get('qa');
            const root=document.documentElement;
            const body=document.body;
            body.dataset.qaOverflow=String(root.scrollWidth>root.clientWidth);
            body.dataset.qaDense=String(document.querySelector('.situation')?.classList.contains('dense'));
            body.dataset.qaScenarioCount=String(document.querySelectorAll('#caseList .case').length);
            if(qa==='picker'){
              document.querySelectorAll('.topbar,.hero').forEach(el=>el.style.display='none');
              document.querySelectorAll('#cases,#evidence,#route,#template,footer,.mobile-bar').forEach(el=>el.style.display='none');
            }
            if(qa==='evidence'){
              document.querySelectorAll('.topbar,.hero,.situation,#cases').forEach(el=>el.style.display='none');
              document.querySelectorAll('#route,#template,footer,.mobile-bar').forEach(el=>el.style.display='none');
            }
          })();
          </script>'''
          p.write_text(s.replace('</body>',probe+'</body>'))
          PY

          python3 -m http.server 4173 >/tmp/buchikui-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1

          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 \
            --screenshot=/tmp/rental-picker.png 'http://127.0.0.1:4173/?case=rental&qa=picker'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 \
            --screenshot=/tmp/beauty-picker.png 'http://127.0.0.1:4173/?case=beauty-hair&qa=picker'
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 \
            --screenshot=/tmp/rental-evidence.png 'http://127.0.0.1:4173/?case=rental&qa=evidence'

          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --dump-dom \
            'http://127.0.0.1:4173/?case=rental' >/tmp/rental.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --dump-dom \
            'http://127.0.0.1:4173/?case=beauty-hair' >/tmp/beauty.html

          grep -q 'data-qa-overflow="false"' /tmp/rental.html
          grep -q 'data-qa-overflow="false"' /tmp/beauty.html
          grep -q 'data-qa-dense="true"' /tmp/rental.html
          grep -q 'data-qa-dense="false"' /tmp/beauty.html
          grep -q 'data-qa-scenario-count="8"' /tmp/rental.html
          grep -q 'data-qa-scenario-count="6"' /tmp/beauty.html

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: editorial-ui-qa
          path: |
            /tmp/rental-picker.png
            /tmp/beauty-picker.png
            /tmp/rental-evidence.png
            /tmp/rental.html
            /tmp/beauty.html

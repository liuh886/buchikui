name: Issue 39 closeout

on:
  push:
    branches:
      - fix/frontend-quality-39

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/frontend-quality-39
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply canonical CSS fix
        run: python3 scripts/issue39_apply.py

      - name: Validate static contracts
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/check-frontend-contract.mjs

      - name: Install temporary browser runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser acceptance
        run: |
          python3 -m http.server 4173 > /tmp/buchikui-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test tests/issue39-browser.spec.js --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue39-browser-evidence
          path: issue39-mobile.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit product CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): contain mobile case switcher scrolling"
          git push origin HEAD:fix/frontend-quality-39
